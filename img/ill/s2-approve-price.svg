<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250"
     role="img" aria-label="A price breakdown on a tracking page with Approve and Decline buttons">
  <!--
    Stand-in for s2-agree-price.png, which showed a WhatsApp chat window with
    green bubbles reading "Final Price" and "Pickup Confirmed". Errands are not
    booked or priced over WhatsApp any more — the rider prices the items and the
    figure lands on the customer's tracking page to approve or decline — so that
    picture described a process the business no longer runs.

    Deliberately not a grey "placeholder" box: this page is live and
    customer-facing. Replace it by dropping artwork at this path.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF5F9"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="42" y="18" width="216" height="214" rx="18" fill="url(#plate)" stroke="#F2DCE6" stroke-width="2"/>

  <!-- header strip -->
  <rect x="42" y="18" width="216" height="46" rx="18" fill="#E0116E"/>
  <rect x="42" y="46" width="216" height="18" fill="#E0116E"/>
  <circle cx="66" cy="41" r="9" fill="#fff" opacity=".9"/>
  <path d="M62 41.5l3 3 6-6.5" stroke="#E0116E" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="35" width="92" height="7" rx="3.5" fill="#fff" opacity=".95"/>
  <rect x="84" y="47" width="58" height="6" rx="3" fill="#fff" opacity=".55"/>

  <!-- line items -->
  <rect x="62" y="84"  width="74" height="7" rx="3.5" fill="#CFC7CB"/>
  <rect x="190" y="84" width="48" height="7" rx="3.5" fill="#0B0A0B"/>

  <rect x="62" y="106" width="92" height="7" rx="3.5" fill="#CFC7CB"/>
  <rect x="198" y="106" width="40" height="7" rx="3.5" fill="#0B0A0B"/>

  <line x1="62" y1="128" x2="238" y2="128" stroke="#F0E6EA" stroke-width="2"/>

  <!-- total -->
  <rect x="62" y="140" width="46" height="9" rx="4.5" fill="#0B0A0B"/>
  <rect x="182" y="138" width="56" height="12" rx="6" fill="#E0116E"/>

  <!-- actions -->
  <rect x="62" y="172" width="84" height="34" rx="17" fill="#E0116E"/>
  <path d="M90 189.5l5 5 10-10.5" stroke="#fff" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="154" y="172" width="84" height="34" rx="17" fill="#fff" stroke="#D9CFD4" stroke-width="2"/>
  <path d="M186 183l16 16M202 183l-16 16" stroke="#6B6165" stroke-width="2.6" stroke-linecap="round"/>
</svg>
